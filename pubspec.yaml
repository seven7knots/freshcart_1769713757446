name: kj_delivery
description: KJ Delivery - Food, Grocery & Services
publish_to: none
version: 1.1.0+5

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # CRITICAL: Core UI and responsive design - DO NOT REMOVE OR MODIFY
  supabase_flutter: ^2.9.1
  sizer: ^2.0.15
  flutter_svg: ^2.0.9
  google_fonts: ^6.1.0
  shared_preferences: ^2.2.2
  web: ^1.1.1

  # Feature dependencies - safe to modify
  cached_network_image: ^3.3.1
  connectivity_plus: ^6.1.4
  dio: ^5.4.0
  fluttertoast: ^8.2.4
  fl_chart: ^0.65.0
  permission_handler: ^11.1.0
  camera: ^0.10.5+5
  image_picker: ^1.0.4
  record: ^6.0.0
  mobile_scanner: ^6.0.11
  carousel_slider: ^5.1.1
  flutter_credit_card: ^4.1.0
  pay: ^3.2.1
  google_maps_flutter: ^2.12.3
  geolocator: ^13.0.4
  speech_to_text: ^7.3.0
  provider: ^6.1.1
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1
  flutter_riverpod: ^2.4.9
  uuid: ^4.3.3
  dart_jsonwebtoken: ^2.14.0
  firebase_core: ^4.4.0
  firebase_analytics: ^12.1.1
  geocoding: ^3.0.0
  # SESSION 20: Push notifications (Issue 10)
  firebase_crashlytics: 5.0.7
  firebase_messaging: ^16.1.1
  flutter_local_notifications: ^18.0.1


  intl: any

  universal_html: ^2.2.4
  url_launcher: any
  http: any
  google_sign_in: ^7.2.0
  share_plus: ^12.0.1

  # Bulk product import
  file_picker: ^8.0.0+1
  csv: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.8
  freezed: ^2.4.6
  json_serializable: ^6.7.1
  flutter_launcher_icons: ^0.14.3

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/
    - assets/images/
    - assets/images/onboarding/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/kj_delivery_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#E50913"
  adaptive_icon_foreground: "assets/images/kj_delivery_icon.png"
  web:
    generate: true
    image_path: "assets/images/kj_delivery_icon.png"
